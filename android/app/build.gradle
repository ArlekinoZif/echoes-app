plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

import groovy.json.JsonOutput

// The app talks to its own API service, exposed under /app-api on the production
// domain and backed by the production database. The website is served separately.
def productionApiUrl = "https://app.echoes.fans/app-api"
def siteUrl = "https://app.echoes.fans"
def debugApiUrl = providers.gradleProperty("DEBUG_API_URL").getOrElse(productionApiUrl)

def releaseStoreFile = providers.gradleProperty("RELEASE_STORE_FILE")
        .orElse(providers.environmentVariable("RELEASE_STORE_FILE")).getOrElse("")
def releaseStorePassword = providers.gradleProperty("RELEASE_STORE_PASSWORD")
        .orElse(providers.environmentVariable("RELEASE_STORE_PASSWORD")).getOrElse("")
def releaseKeyAlias = providers.gradleProperty("RELEASE_KEY_ALIAS")
        .orElse(providers.environmentVariable("RELEASE_KEY_ALIAS")).getOrElse("")
def releaseKeyPassword = providers.gradleProperty("RELEASE_KEY_PASSWORD")
        .orElse(providers.environmentVariable("RELEASE_KEY_PASSWORD")).getOrElse("")

android {
    namespace 'fans.echoes.client'
    compileSdk 36

    defaultConfig {
        applicationId "fans.echoes.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "API_URL", JsonOutput.toJson(productionApiUrl)
        buildConfigField "String", "SITE_URL", JsonOutput.toJson(siteUrl)
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Lets the native client sit beside the old WebView shell during migration.
            applicationIdSuffix ".dev"
            buildConfigField "String", "API_URL", JsonOutput.toJson(debugApiUrl)
        }
        qa {
            initWith release
            applicationIdSuffix ".qa"
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
            debuggable false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // Pinned rather than taking the latest BOM: Compose 1.12+ requires AGP 9.1
    // and compileSdk 37, while the store still requires targetSdk 36.
    implementation 'androidx.compose.ui:ui:1.11.4'
    implementation 'androidx.compose.ui:ui-graphics:1.11.4'
    implementation 'androidx.compose.foundation:foundation:1.11.4'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.11.4'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.11.4'

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.security:security-crypto:1.1.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:3.0.0'

    implementation 'io.coil-kt.coil3:coil-compose:3.2.0'
    // Reads the orientation of a picked cover photo so it is not uploaded sideways.
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.2.0'

    implementation 'androidx.media3:media3-exoplayer:1.9.4'
    implementation 'androidx.media3:media3-session:1.9.4'
    implementation 'androidx.media3:media3-ui:1.9.4'

    // Seed Vault and any other Mobile Wallet Adapter wallet.
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib-ktx:2.0.8'
}
